[project]
name = "student-manager"
version = "0.1.0"
description = "Student management application"
authors = [
    {name = "Sabie Melanie NITEKA",email = "sabie.niteka@efrei.net"},
    {name = "Celeste Oudjane", email = "celeste.oudjane@efrei.net"},
    {name = "Amandine LENAR", email = "amandine.lenar@efrei.net"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]

[tool.poetry]
packages = [{include = "student_manager", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]